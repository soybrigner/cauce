<style>
:root{--bg:#F7F4EE;--sheet:#FCFAF6;--ink:#1B1D1F;--ink2:#4A4C4E;--ink3:#6B6D6F;--line:#E4DFD5;--wash:#EFEAE0;--acc:#2A7A63;--acc-soft:#DCEBE4;--on-acc:#FFFFFF;--on-ink:#F7F4EE;--warn:#B5603F;--out:#B9B5AB;--nec:#2F4A7A;--gus:#C2A15F;--aho:#2A7A63;--c-otros:#6F6C67;--c-hogar:#C79A2B;--c-salud:#3F6FA6;--c-comida:#B5603F;--c-transporte:#2F8F7B;--c-ocio:#7B62B0;--c-m0:#B8577A;--c-m1:#7E8F3A;--c-m2:#3E8CA8;--c-m3:#8B6B4A;--c-m4:#9A4F8F;--c-m5:#C0504D;--scrim:rgba(27,29,31,.38);--shadow:0 -12px 40px rgba(27,29,31,.12);color-scheme:light;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141618;--sheet:#1B1E21;--ink:#ECE9E2;--ink2:#B3B1AB;--ink3:#85847F;--line:#2A2E31;--wash:#202427;--acc:#4DAA8E;--acc-soft:#1F3A32;--on-acc:#0F1412;--on-ink:#141618;--warn:#E0805C;--out:#5C605F;--nec:#6F95E0;--gus:#E0C98F;--aho:#4DAA8E;--c-otros:#8E8B85;--c-hogar:#E3BE4F;--c-salud:#6F9FE0;--c-comida:#E0805C;--c-transporte:#4DB89A;--c-ocio:#A892E0;--c-m0:#E08AA8;--c-m1:#A9BE5E;--c-m2:#6EB6D0;--c-m3:#BF9A74;--c-m4:#C985BF;--c-m5:#E8837F;--scrim:rgba(0,0,0,.55);--shadow:0 -12px 40px rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#141618;--sheet:#1B1E21;--ink:#ECE9E2;--ink2:#B3B1AB;--ink3:#85847F;--line:#2A2E31;--wash:#202427;--acc:#4DAA8E;--acc-soft:#1F3A32;--on-acc:#0F1412;--on-ink:#141618;--warn:#E0805C;--out:#5C605F;--nec:#6F95E0;--gus:#E0C98F;--aho:#4DAA8E;--c-otros:#8E8B85;--c-hogar:#E3BE4F;--c-salud:#6F9FE0;--c-comida:#E0805C;--c-transporte:#4DB89A;--c-ocio:#A892E0;--c-m0:#E08AA8;--c-m1:#A9BE5E;--c-m2:#6EB6D0;--c-m3:#BF9A74;--c-m4:#C985BF;--c-m5:#E8837F;--scrim:rgba(0,0,0,.55);--shadow:0 -12px 40px rgba(0,0,0,.5);color-scheme:dark;}
/* ===== base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p{margin:0}
.serif,.hero,h1,h2{font-family:'Fraunces',Georgia,'Times New Roman',serif}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
::selection{background:var(--acc-soft)}

#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
#screen{padding:calc(env(safe-area-inset-top) + 22px) 22px calc(104px + env(safe-area-inset-bottom))}
.screen-in{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== tipografía ===== */
h1{font-weight:400;font-size:30px;line-height:1.1;letter-spacing:-.015em;font-variation-settings:'opsz' 96,'SOFT' 40}
h2{font-weight:400;font-size:21px;line-height:1.2;letter-spacing:-.01em;font-variation-settings:'opsz' 36,'SOFT' 40}
.sub{color:var(--ink2);font-size:14px}
.mute{color:var(--ink3);font-size:13px}
.num{font-variant-numeric:tabular-nums lining-nums}
.big{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:34px;letter-spacing:-.02em;font-variation-settings:'opsz' 120,'SOFT' 50;line-height:1.05}

/* ===== encabezado ===== */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.hello{font-size:15px;color:var(--ink2)}
.hello b{font-weight:500;color:var(--ink)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);padding-top:3px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--ink3);display:block}
.sync.ok i{background:var(--acc)}
.sync.err i{background:var(--warn)}

/* ===== héroe: disponible hoy ===== */
.hero-wrap{position:relative;display:flex;justify-content:center;margin:10px 0 2px}
.hero-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 38px}
.hero-label{font-size:14px;color:var(--ink2);margin-bottom:2px}
.hero{font-weight:300;font-size:clamp(46px,14.5vw,64px);line-height:1;letter-spacing:-.025em;font-variation-settings:'opsz' 144,'SOFT' 60}
.hero.small{font-size:clamp(38px,11.5vw,50px)}
.hero-note{font-size:13px;color:var(--ink3);margin-top:8px}
.ring-arc{animation:draw 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes draw{from{stroke-dasharray:0 1000}}
.lede{text-align:center;color:var(--ink2);font-size:15px;max-width:30ch;margin:6px auto 0}

/* ===== listas ===== */
.sec{margin-top:30px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.link{color:var(--acc);font-size:14px;font-weight:500;padding:6px 0}
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;min-height:56px}
button.row:active{background:var(--wash)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt-r{font-size:16px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .amt-r.pos{color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.day{font-size:13px;color:var(--ink3);padding:18px 0 6px}
.pocket .bal{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:350;letter-spacing:-.01em;font-variation-settings:'opsz' 36}

/* ===== recordatorios ===== */
.remind{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.remind .grow{flex:1;min-width:0}
.remind .t{font-size:15px}
.remind .s{font-size:13px;color:var(--ink3)}
.remind.late .s{color:var(--warn)}

/* ===== botones y campos ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-weight:500;font-size:16px;text-align:center}
.btn:active{transform:scale(.98)}
.btn.block{display:flex;width:100%}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.warn{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.btn[disabled]{opacity:.4;pointer-events:none}
.field{display:block;margin:14px 0}
.field>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;appearance:none;-webkit-appearance:none}
.inp:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 15px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:15px;display:inline-flex;align-items:center;gap:8px;background:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);box-shadow:none}
.chip[disabled]{opacity:.35;pointer-events:none}
.chip small{font-size:12px;opacity:.7}
.seg{display:flex;background:var(--wash);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:999px;text-align:center;font-size:15px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.msg{color:var(--warn);font-size:14px;min-height:20px;margin:6px 0 0;text-align:center}
.actions{display:grid;gap:10px;margin-top:18px}
.actions.two{grid-template-columns:1fr 1fr}

/* ===== barra inferior ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:end;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;justify-content:center;color:var(--ink3);font-size:11.5px;border-radius:12px}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.fab{position:relative;justify-self:center;width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 0 0 6px var(--bg),0 8px 22px rgba(27,29,31,.18)}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.fab:active{transform:scale(.95)}

/* ===== hojas inferiores ===== */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s;z-index:20}
.scrim.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:94vh;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:26px 26px 0 0;padding:10px 22px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:21;box-shadow:var(--shadow)}
.sheet.in{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.x{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);margin:-6px -8px -6px 0}
.x svg,.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.back{display:flex;align-items:center;gap:4px;color:var(--ink2);font-size:15px;min-height:40px;margin-left:-6px}

/* ===== teclado numérico ===== */
.amt{text-align:center;font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:clamp(44px,14vw,60px);letter-spacing:-.02em;line-height:1.1;margin:8px 0 2px;font-variation-settings:'opsz' 144,'SOFT' 60;word-break:break-all}
.amt .cs{font-size:.5em;color:var(--ink3);margin-right:6px;vertical-align:.35em}
.amt.zero{color:var(--ink3)}
.amt-sub{text-align:center;font-size:13px;color:var(--ink3);min-height:19px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:10px -4px 4px}
.key{height:58px;border-radius:14px;font-family:'Fraunces',Georgia,serif;font-size:27px;font-weight:350;text-align:center;display:flex;align-items:center;justify-content:center;font-variation-settings:'opsz' 36}
.key:active{background:var(--wash)}
.key svg{width:24px;height:24px;stroke:var(--ink2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:13px;color:var(--ink2);margin:16px 0 8px}

/* ===== reparto (barra con dos manijas) ===== */
.split{position:relative;height:76px;margin:20px 0 14px;touch-action:none;user-select:none;-webkit-user-select:none}
.split-bar{display:flex;gap:2px;height:100%}
.split-bar>div{min-width:0;border-radius:6px;transition:none}
.split-bar>div:first-child{border-radius:16px 6px 6px 16px}
.split-bar>div:last-child{border-radius:6px 16px 16px 6px}
.hd{position:absolute;top:0;bottom:0;width:44px;margin-left:-22px;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center;z-index:2}
.hd::after{content:'';width:6px;height:36px;border-radius:3px;background:var(--sheet);box-shadow:0 0 0 1.5px var(--ink),0 2px 8px rgba(0,0,0,.18)}
.hd:focus-visible{outline:none}
.hd:focus-visible::after{box-shadow:0 0 0 2.5px var(--acc),0 2px 8px rgba(0,0,0,.18)}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.srow .nm{flex:1}
.srow .pc{color:var(--ink3);font-size:14px;width:44px;text-align:right}
.srow .v{font-variant-numeric:tabular-nums;font-size:17px;width:128px;text-align:right;white-space:nowrap}

/* ===== mi mes ===== */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.mnav h1{text-transform:capitalize}
.iconbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[disabled]{opacity:.25;pointer-events:none}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px}
.trio .l{font-size:13px;color:var(--ink2)}
.trio .v{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:350;letter-spacing:-.015em;font-variation-settings:'opsz' 36;margin-top:2px}
.trio .v.pos{color:var(--acc)}
.catbar{display:flex;gap:2px;height:14px;margin:14px 0 6px}
.catbar>i{display:block;min-width:3px;border-radius:3px}
.legend{margin-top:8px}
.leg{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.leg:last-child{border-bottom:0}
.leg .sq{width:10px;height:10px;border-radius:3px;flex:none}
.leg .nm{flex:1}
.leg .pc{color:var(--ink3);font-size:13px;width:40px;text-align:right}
.leg .v{font-variant-numeric:tabular-nums;width:116px;text-align:right;white-space:nowrap}
.legend-inline{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-top:6px}
.legend-inline span{display:flex;align-items:center;gap:6px}
.flow{width:100%;height:auto;display:block;margin-top:6px}
.flow rect{cursor:pointer}
.flow-cap{font-size:14px;color:var(--ink2);min-height:21px}
.flow-cap b{font-weight:500;color:var(--ink);text-transform:capitalize}
.empty{text-align:center;padding:36px 12px;color:var(--ink2)}
.empty h2{margin-bottom:8px;color:var(--ink)}
.empty .btn{margin-top:18px}

/* ===== metas ===== */
.goal{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);width:100%}
.gphoto{position:relative;width:76px;height:76px;flex:none}
.gphoto .ring{position:absolute;inset:0}
.gphoto .ph{position:absolute;inset:7px;border-radius:50%;overflow:hidden;background:var(--wash);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:26px;color:var(--ink3)}
.gphoto img{width:100%;height:100%;object-fit:cover;display:block}
.goal .nm{font-family:'Fraunces',Georgia,serif;font-size:19px;line-height:1.2;font-variation-settings:'opsz' 24}
.goal .st{font-size:14px;color:var(--ink2);margin-top:3px}
.goal .hint{font-size:13px;color:var(--ink3);margin-top:2px}
.goal.done .hint{color:var(--acc)}
.gbig{width:180px;height:180px;margin:6px auto 4px;position:relative}
.gbig .ring{position:absolute;inset:0;width:100%;height:100%}
.gbig .ph{position:absolute;inset:14px;border-radius:50%;overflow:hidden;background:var(--wash);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:56px;color:var(--ink3)}
.gbig img{width:100%;height:100%;object-fit:cover}
.pct{text-align:center;font-family:'Fraunces',Georgia,serif;font-size:15px;color:var(--ink2);margin-top:2px}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .th{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--wash);flex:none}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* ===== celebración discreta ===== */
.celebrate{text-align:center;padding:10px 0 4px}
.celebrate .rw{position:relative;display:flex;justify-content:center;margin:6px 0 10px}
.celebrate h2{font-size:24px;margin:6px 0 6px}
.celebrate .sparks{position:absolute;inset:0;pointer-events:none}
.celebrate .sparks i{position:absolute;left:50%;top:50%;width:2px;height:10px;border-radius:1px;background:var(--acc);opacity:0;transform-origin:50% 0;animation:spark 1.1s ease-out .55s both}
@keyframes spark{0%{opacity:0;transform:rotate(var(--a)) translateY(52px)}30%{opacity:.9}100%{opacity:0;transform:rotate(var(--a)) translateY(86px)}}

/* ===== ajustes ===== */
.set-h{font-size:13px;color:var(--ink3);margin:28px 0 4px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);min-height:56px;width:100%}
.kv .k{flex:1}
.kv .k small{display:block;color:var(--ink3);font-size:13px;margin-top:2px}
.kv .v{color:var(--ink2);font-size:15px}
.note{font-size:13px;color:var(--ink3);line-height:1.5;margin-top:10px}

/* ===== toast ===== */

var BAR_ORDER = ['otros', 'hogar', 'salud', 'comida', 'transporte', 'ocio'];

App.save = function () { Store.save(App.S); };
App.commit = function () { C.ensureTrial(App.S, App.now()); App.save(); render(); };

function greeting() { var h = App.now().getHours(); return h < 12 ? T('Buenos días') : h < 19 ? T('Buenas tardes') : T('Buenas noches'); }
function syncInfo() {
  var s = Store.status();
  return ({ synced: ['ok', T('Guardado')], syncing: ['', T('Guardando…')], connecting: ['', T('Conectando…')], error: ['err', T('Sin copia en la nube')], full: ['err', T('Copia llena')], local: ['', T('En este dispositivo')], offline: ['', T('Sin conexión')] })[s] || ['', ''];
}
function syncHTML() { var m = syncInfo(); return '<div class="sync ' + m[0] + '" id="sync" role="status"><i></i>' + m[1] + '</div>'; }
function paintSync() { var el = $('#sync'); if (!el) return; var m = syncInfo(); el.className = 'sync ' + m[0]; el.innerHTML = '<i></i>' + m[1]; }
function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }

function txRow(t) {
  var S = App.S, title, sub, amt, cls = '';
  if (t.t === 'e') {
    var pn = t.parts ? t.parts.map(function (p) { return p.cat ? catName(p.cat) : T('Sin categoría'); }).join(' + ') : '';
    title = t.note || pn || catName(t.cat) || T('Gasto'); sub = pocketName(t.pocket) + (t.note && pn ? ' · ' + pn : (t.cat && t.note ? ' · ' + catName(t.cat) : '')); amt = '−' + M(t.amt);
  }
  else if (t.t === 'i') { var sn = t.src ? srcName(t.src) : ''; title = t.note || sn || T('Ingreso'); var ak = Object.keys(t.alloc); sub = (t.note && sn ? sn + ' · ' : '') + (ak.length === 1 ? TF('Entró en {0}', pocketName(ak[0])) : TF('Repartido en {0} cuentas', ak.length)); amt = '+' + M(t.amt); cls = ' pos'; }
  else if (t.open) { title = t.note || T('Saldo inicial'); sub = pocketName(t.to); amt = '+' + M(t.amt); cls = ' pos'; }
  else { title = t.note || (C.findIn(S.debts, t.to) ? T('Pago de deuda') : T('Movimiento')); sub = TF('De {0} a {1}', pocketName(t.from), pocketName(t.to)) + (t.fx ? ' · ' + C.moneyIn(t.fx.a, t.fx.c) : ''); amt = M(t.amt); }
  return '<button type="button" class="row" data-act="tx" data-id="' + esc(t.id) + '"><div class="grow"><div class="t">' + esc(title) + (t.rcp ? '<span class="clip" role="img" aria-label="' + esc(T('Tiene foto del recibo')) + '">' + ICON.clip + '</span>' : '') + '</div><div class="s">' + esc(sub) + '</div></div><div class="amt-r' + cls + '">' + esc(amt) + '</div></button>';
}

// ================= Inicio =================
function lede(a) {
  if (a.free <= 0) return T('Por ahora no queda margen libre. Si lo necesitas, mueve algo desde Ahorro.');
  if (a.spent === 0) return T('Mes nuevo, cuentas claras. Esto es lo que puedes gastar hoy sin pensarlo.');
  if (a.spentPct <= a.monthPct + 0.05) return T('Vas con calma: el mes va al ritmo que tú quieres.');
  return T('Este mes ha ido un poco más rápido. Con lo que queda, así se reparte.');
}
function weekDots(now) {
  var set = {}, cur = C.parseYmd(C.weekKey(now)), out = [], i, d;
  App.S.tx.forEach(function (t) { set[C.weekKey(C.parseYmd(t.d))] = 1; });
  for (i = 7; i >= 0; i--) { d = new Date(cur); d.setDate(d.getDate() - 7 * i); out.push(!!set[C.ymd(d)]); }
  return out;
}
function renderHome() {
  var S = App.S, now = App.now(), a = C.available(S, now), b = a.balances, empty = S.tx.length === 0, h = '';

    + '<div class="hello">' + greeting() + (S.profile.name ? ', <b>' + esc(S.profile.name) + '</b>' : '') + '</div></div>' + syncHTML() + '</div>';
  if (S.profile.demo) h += ('<div class="demo"><span>' + T('Estás viendo datos de ejemplo.') + '</span><button type="button" class="link" data-act="demo-off">' + T('Empezar con los míos') + '</button></div>');
  var num = M(Math.floor(a.perDay)), fs = num.length <= 6 ? 60 : num.length <= 8 ? 50 : num.length <= 10 ? 42 : 36;

    + ('<div class="hero-label">' + T('Disponible hoy')) + (empty ? '' : ' <span class="ii" aria-hidden="true">' + ICON.info + '</span>') + '</div><div class="hero num" style="font-size:' + fs + 'px">' + esc(num) + '</div>'
    + '<div class="hero-note">' + (empty ? T('Aquí aparecerá cada día') : esc(TF('Quedan {0} para {1}', M(Math.max(0, a.free)), plural(a.left, T('día'), T('días'))))) + '</div>' + (empty ? '</div>' : '</button>') + '</div>';
  h += '<p class="lede">' + (empty ? T('Empieza registrando lo que te entró. Cauce lo reparte y te dice cuánto puedes usar cada día.') : lede(a)) + '</p>';
  if (empty) h += ('<div class="actions"><button type="button" class="btn block" data-act="add-income">' + T('Registrar mi primer ingreso') + '</button></div>');

  var rem = C.homeReminders(S, now).slice(0, 2);
  if (rem.length) {

    rem.forEach(function (x) {
      var r = x.r, st = x.st, sub, act;

      else {
        sub = st.state === 'late' ? TF('Era hace {0} · {1}', plural(st.days, T('día'), T('días')), M(r.amt)) : st.state === 'today' ? TF('Es hoy · {0}', M(r.amt)) : TF('En {0} · {1}', plural(st.days, T('día'), T('días')), M(r.amt));
        act = '<button type="button" class="btn sm ghost" data-act="rem-pay" data-id="' + esc(r.id) + ('">' + T('Ya pagué') + '</button>');
      }
      h += '<div class="remind' + (st.state === 'late' ? ' late' : '') + '"><div class="grow"><div class="t">' + esc(r.name) + '</div><div class="s">' + esc(sub) + '</div></div>' + act + '</div>';

  h += ('<div class="sec"><div class="sec-h"><h2>' + T('Tus cuentas') + '</h2></div><div class="list">');
  S.pockets.forEach(function (p) {
    h += '<button type="button" class="row pocket" data-act="pocket" data-id="' + p.id + '"><i class="dot" style="background:var(--' + p.id + ')"></i><div class="grow"><div class="t">' + esc(C.pocketLabel(p)) + '</div><div class="s">' + esc(info[p.id]) + '</div></div>'

  });
  C.activeAccounts(S).forEach(function (x) {
    h += '<button type="button" class="row pocket" data-act="pocket" data-id="' + esc(x.id) + '"><i class="dot" style="background:var(--ink3)"></i><div class="grow"><div class="t">' + esc(x.name) + '</div><div class="s">' + esc(x.daily ? T('Cuenta propia · en Disponible hoy') : T('Cuenta propia')) + '</div></div><div class="bal num">' + esc(M(b[x.id] || 0)) + '</div></button>';
  });
  h += '</div></div>';

  if (!empty) {
    var last = C.sortedTx(S).slice(0, 4);
    h += ('<div class="sec"><div class="sec-h"><h2>' + T('Últimos movimientos') + '</h2><button type="button" class="link" data-act="tab" data-t="month">' + T('Ver todo') + '</button></div><div class="list">') + last.map(txRow).join('') + '</div></div>';
    var dots = weekDots(now), k = C.streakWeeks(S, now);
    h += ('<div class="streak" aria-label="' + T('Semanas con registros') + '"><div class="dots" aria-hidden="true">') + dots.map(function (d) { return '<i class="' + (d ? 'on' : '') + '"></i>'; }).join('') + '</div>'
      + '<p>' + (k >= 2 ? esc(TF('{0} seguidas registrando. Así se ve la constancia.', plural(k, T('semana'), T('semanas')))) : k === 1 ? T('Esta semana ya registraste. Una más y empieza tu racha.') : T('Registra algo esta semana y vuelve a empezar, sin presión.')) + '</p></div>';

// ================= Mi mes =================
function renderMonth() {
  var S = App.S, now = App.now(), cm = ymNow(), ym = App.ym || cm, h = '';
  var earliest = cm; S.tx.forEach(function (t) { var m = C.ymOf(t.d); if (m < earliest) earliest = m; });
  var st = C.monthStats(S, ym), name = C.monthName(ym), yr = ym.slice(0, 4);
  h += ('<div class="mnav"><button type="button" class="iconbtn" data-act="mprev" aria-label="' + T('Mes anterior') + '"') + (ym <= earliest ? ' disabled' : '') + '>' + ICON.back + '</button><h1><button type="button" class="mtitle" data-act="mpick" aria-haspopup="dialog" aria-label="' + esc(T('Ir a otro mes')) + '">' + esc(name) + ' ' + yr + '<i class="chev" aria-hidden="true"></i></button></h1>'
    + ('<button type="button" class="iconbtn" data-act="mnext" aria-label="' + T('Mes siguiente') + '"') + (ym >= cm ? ' disabled' : '') + '>' + ICON.next + '</button></div>';
  if (S.tx.length) h += '<button type="button" class="searchbar" data-act="search">' + ICON.search + '<span>' + esc(T('Buscar en todo el historial')) + '</span></button>';
  if (st.n === 0 && S.tx.length === 0) {
    return h + ('<div class="empty"><h2>' + T('Todavía no hay nada que mirar') + '</h2><p>' + T('Cuando registres ingresos y gastos, aquí verás cómo se movió tu mes.') + '</p><button type="button" class="btn" data-act="add-income">' + T('Registrar un ingreso') + '</button></div>');
  }
  h += ('<div class="trio"><div><div class="l">' + T('Entró') + '</div><div class="v num pos">') + esc(M(st.inc)) + ('</div></div><div><div class="l">' + T('Salió') + '</div><div class="v num">') + esc(M(st.out)) + ('</div></div><div><div class="l">' + T('Quedó') + '</div><div class="v num') + (st.net > 0 ? ' pos' : '') + '">' + esc(M(st.net)) + '</div></div></div>';

  if (st.n > 0) h += '<button type="button" class="link msum-link" data-act="msum" data-ym="' + ym + '">' + esc(ym === cm ? T('Así va el mes') : T('Resumen del mes')) + '</button>';
  var view = App.mview || 'all';
  h += ('<div class="seg mseg" role="group" aria-label="' + T('Ver') + '">') + [['all', T('Todo')], ['out', T('Gastos')], ['in', T('Ingresos')]].map(function (o) {
    return '<button type="button" data-act="mview" data-v="' + o[0] + '" aria-pressed="' + (view === o[0]) + '">' + o[1] + '</button>';
  }).join('') + '</div>';

  if (view !== 'in') {
    h += ('<div class="sec"><div class="sec-h"><h2>' + T('Para dónde fue') + '</h2></div>');
    if (st.out <= 0) h += ('<p class="sub">' + T('Sin gastos en este mes.') + '</p>');
    else h += breakdownHTML(expenseRows(S, st), st.out, T('Gastos por categoría'));
    h += '</div>' + budgetsHTML(S, ym, st.out > 0);
  }
  if (view !== 'out') {
    h += ('<div class="sec"><div class="sec-h"><h2>' + T('De dónde vino') + '</h2></div>');
    if (st.inc <= 0) h += ('<p class="sub">' + T('Sin ingresos en este mes.') + '</p>');
    else {
      var ir = incomeRows(S, st);
      if (ir.length === 1 && ir[0].id === 'none') h += ('<p class="sub">' + T('Todavía no marcas de dónde viene tu plata. Al registrar un ingreso elige la fuente (Sueldo, Propinas…) y aquí verás el desglose.') + '</p>');
      else h += breakdownHTML(ir, st.inc, T('Ingresos por fuente'));
    }
    h += '</div>';
  }

  var rg = App.mrange || '6', series, rtitle;
  if (rg === 'all') { series = C.rangeSeries(S, earliest, cm); rtitle = T('Todo el historial'); }
  else if (typeof rg === 'object') { series = C.rangeSeries(S, rg.from, rg.to); rtitle = ymLabel(series[0].ym) + ' – ' + ymLabel(series[series.length - 1].ym); }
  else { series = C.flowSeries(S, ym, +rg); rtitle = TF('Últimos {0} meses', +rg); }
  var ix = -1; series.forEach(function (m, i) { if (m.ym === ym) ix = i; });
  var sel = App.flowSel != null && App.flowSel < series.length ? App.flowSel : (ix >= 0 ? ix : series.length - 1), sm = series[sel];
  var only = view === 'all' ? null : view, rgKey = typeof rg === 'object' ? 'custom' : rg;
  h += '<div class="sec"><div class="sec-h"><h2 class="rtitle">' + esc(rtitle) + '</h2></div>';
  h += '<div class="seg rseg" role="group" aria-label="' + esc(T('Rango de meses')) + '">' + [['6', T('6 meses')], ['12', T('12 meses')], ['all', T('Todo')], ['custom', T('Fechas')]].map(function (o) {
    return '<button type="button" data-act="mrange" data-v="' + o[0] + '" aria-pressed="' + (rgKey === o[0]) + '">' + esc(o[1]) + '</button>';
  }).join('') + '</div>';
  var ariaTxt = only === 'out' ? TF('Lo que salió: {0}', rtitle) : only === 'in' ? TF('Lo que entró: {0}', rtitle) : TF('Lo que entró y salió: {0}', rtitle);
  h += Charts.flow(series, sel, { aria: ariaTxt, view: T('Ver'), only: only });
  if (!only) h += ('<div class="legend-inline"><span><i class="dot" style="background:var(--acc)"></i>' + T('Entró') + '</span><span><i class="dot" style="background:var(--out)"></i>' + T('Salió') + '</span></div>');
  h += '<div class="flow-cap" style="margin-top:10px"><b>' + esc(C.monthName(sm.ym) + ' ' + sm.ym.slice(0, 4)) + '</b> · ' + esc(only === 'out' ? TF('Salió {0}', M(sm.out)) : only === 'in' ? TF('Entró {0}', M(sm.inc)) : TF('Entró {0} · Salió {1}', M(sm.inc), M(sm.out)))
    + (sm.ym !== ym ? ' <button type="button" class="link" data-act="mgo" data-ym="' + sm.ym + '">' + esc(T('Ir a este mes')) + '</button>' : '') + '</div>';
  if (series.length > 1) {
    var tin = 0, tout = 0; series.forEach(function (m) { tin += m.inc; tout += m.out; });
    h += '<p class="flow-sum">' + esc(only === 'out' ? TF('En total salió {0} · {1} por mes', M(tout), M(tout / series.length)) : only === 'in' ? TF('En total entró {0} · {1} por mes', M(tin), M(tin / series.length)) : TF('En total entró {0}, salió {1} y quedó {2}', M(tin), M(tout), M(tin - tout))) + '</p>';
  }
  h += '</div>' + monthByMonthHTML(series, ym, only);

  var list = C.sortedTx(S).filter(function (t) {

    if (view === 'out') return t.t === 'e' || (t.t === 'm' && !t.open && !!C.findIn(S.debts, t.to));

  });
  h += '<div class="sec"><div class="sec-h"><h2>' + (view === 'out' ? T('Gastos') : view === 'in' ? T('Ingresos') : T('Movimientos')) + '</h2></div>';
  if (!list.length) h += '<p class="sub">' + (view === 'out' ? T('Sin gastos en este mes.') : view === 'in' ? T('Sin ingresos en este mes.') : T('Nada registrado en este mes.')) + '</p>';
  else {
    var shown = list.slice(0, App.moreTx);
    C.groupByDay(shown).forEach(function (g) { h += '<div class="day">' + esc(C.dayLabel(g.d, now)) + '</div><div class="list">' + g.items.map(txRow).join('') + '</div>'; });
    if (list.length > shown.length) h += ('<div class="actions"><button type="button" class="btn ghost block" data-act="more-tx">' + T('Ver más') + '</button></div>');
  }
  return h + '</div>';
}
function expenseRows(S, st) {
  var rows = [], cv = {}, extras = [], slot = C.catSlots(S);
  BAR_ORDER.forEach(function (id) { cv[id] = st.cats[id] || 0; });
  C.EXTRA_CATS.forEach(function (c) { var v = st.cats[c.id] || 0; if (v > 0) { extras.push({ name: C.catLabel(c), v: v }); cv.otros += v; } });
  (S.myCats || []).forEach(function (c) {
    var v = st.cats[c.id] || 0; if (v <= 0) return;
    if (slot[c.id] != null) rows.push({ id: c.id, name: c.name, v: v, color: 'var(--c-m' + slot[c.id] + ')', subs: [] });
    else { extras.push({ name: c.name, v: v }); cv.otros += v; }
  });
  extras.sort(function (x, y) { return y.v - x.v; });
  C.CATS.forEach(function (c) {
    if (cv[c.id] <= 0) return;
    var subs = [];
    if (c.id === 'otros' && extras.length) { subs = extras.slice(); if (st.cats.otros > 0) subs.push({ name: T('Sin categoría'), v: st.cats.otros }); }
    rows.push({ id: c.id, name: C.catLabel(c), v: cv[c.id], color: 'var(--c-' + c.id + ')', subs: subs });
  });
  return rows.sort(function (x, y) { return y.v - x.v; });
}
// Ingresos por fuente: las 6 con más ingreso tienen color propio; el resto (y lo que no tiene fuente) se suma a «Otras».
function incomeRows(S, st) {
  var rows = [], folded = [], none = st.srcs.none || 0, slot = C.srcSlots(S);
  (S.srcs || []).forEach(function (c) {
    var v = st.srcs[c.id] || 0; if (v <= 0) return;
    if (slot[c.id] != null) rows.push({ id: c.id, name: c.name, v: v, color: 'var(--c-m' + slot[c.id] + ')', subs: [] });
    else folded.push({ name: c.name, v: v });
  });
  if (folded.length) {
    folded.sort(function (x, y) { return y.v - x.v; });
    var fv = folded.reduce(function (n, x) { return n + x.v; }, 0) + none, subs = folded.slice();
    if (none > 0) subs.push({ name: T('Sin fuente'), v: none });
    rows.push({ id: 'otras', name: T('Otras'), v: C.r2(fv), color: 'var(--c-otros)', subs: subs });
  } else if (none > 0) rows.push({ id: 'none', name: T('Sin fuente'), v: none, color: 'var(--c-otros)', subs: [] });
  return rows.sort(function (x, y) { return y.v - x.v; });
}
function budgetsHTML(S, ym, anySpend) {
  var bs = C.budgetStatus(S, ym);
  if (!bs.length) return anySpend ? ('<div class="sec bud-sec"><button type="button" class="btn sm ghost" data-act="bud-new">' + T('Poner un tope a una categoría') + '</button></div>') : '';
  var h = ('<div class="sec bud-sec"><div class="sec-h"><h2>' + T('Presupuestos') + '</h2><button type="button" class="btn sm ghost" data-act="bud-new">' + T('Añadir') + '</button></div><div class="list">');
  bs.forEach(function (b) {
    var txt = b.state === 'over' ? TF('Te pasaste {0}', M(b.over)) : b.state === 'near' ? TF('Cerca del tope: quedan {0}', M(b.left)) : TF('Quedan {0}', M(b.left));
    h += '<button type="button" class="bud ' + b.state + '" data-act="bud" data-cat="' + esc(b.cat) + '"><div class="bud-t"><span class="nm">' + esc(catName(b.cat)) + '</span><span class="v num">' + esc(M(b.spent)) + ' / ' + esc(M(b.cap)) + '</span></div>'
      + '<div class="pbar" role="img" aria-label="' + esc(TF('{0} % del tope', Math.round(b.pct * 100))) + '"><i style="width:' + Math.min(100, Math.round(b.pct * 100)) + '%"></i></div><div class="bud-s">' + esc(txt) + '</div></button>';
  });
  return h + '</div></div>';
}
function breakdownHTML(rows, total, aria) {
  var bar = rows.map(function (r) { return '<i style="flex:' + r.v + ';background:' + r.color + '"></i>'; }).join('');
  return '<div class="catbar" role="img" aria-label="' + esc(aria) + '">' + bar + '</div><div class="legend">' + rows.map(function (r) {
    return '<div class="leg"><i class="sq" style="background:' + r.color + '"></i><div class="nm">' + esc(r.name) + '</div><div class="pc num">' + Math.round(r.v / total * 100) + ' %</div><div class="v num">' + esc(M(r.v)) + '</div></div>'
      + r.subs.map(function (u) { return '<div class="leg sub"><div class="nm">' + esc(u.name) + '</div><div class="pc num">' + Math.round(u.v / total * 100) + ' %</div><div class="v num">' + esc(M(u.v)) + '</div></div>'; }).join('');
  }).join('') + '</div>';
}


// ---- De dónde sale «Disponible hoy»
function availDot(x) { return x.kind === 'pocket' ? 'var(--' + x.id + ')' : x.kind === 'goal' ? 'var(--acc)' : 'var(--ink3)'; }
function availHTML() {
  var S = App.S, d = C.availableBreakdown(S, App.now()), h = sheetHead(T('Cómo sale tu disponible'));
  h += ('<p class="sub">' + T('Es lo que puedes gastar hoy sin pensarlo: lo que tienes para el día a día, repartido entre los días que quedan del mes.') + '</p>');

function catChipsHTML(act, sel) {

function splitPaint() {

  var p = Reg.pcts, S = App.S, parts = C.splitAmount(padValue(), p, C.cur(S).dec), names = S.pockets.map(C.pocketLabel);
  for (var i = 0; i < 3; i++) {

    var pc = $('#sp' + i); if (pc) pc.textContent = p[i] + ' %';
    var sv = $('#sv' + i); if (sv) sv.textContent = M(parts[i]);
  }
  var c1 = p[0], c2 = p[0] + p[1], h0 = $('#hd0'), h1 = $('#hd1');
  if (h0) { h0.style.left = c1 + '%'; h0.setAttribute('aria-valuenow', c1); h0.setAttribute('aria-valuetext', TF('{0} {1} por ciento, {2} {3} por ciento', names[0], p[0], names[1], p[1])); }
  if (h1) { h1.style.left = c2 + '%'; h1.setAttribute('aria-valuenow', c2); h1.setAttribute('aria-valuetext', TF('{0} {1} por ciento, {2} {3} por ciento', names[1], p[1], names[2], p[2])); }

function setBoundary(idx, v) {
  var p = Reg.pcts, c1 = p[0], c2 = p[0] + p[1];
  v = Math.max(0, Math.min(100, Math.round(v)));
  if (idx === 0) { c1 = v; if (c1 > c2) c2 = c1; } else { c2 = v; if (c2 < c1) c1 = c2; }
  Reg.pcts = [c1, c2 - c1, 100 - c2]; splitPaint();
}
function bindSplit() {
  var box = $('#split'); if (!box) return;
  [0, 1].forEach(function (idx) {
    var el = $('#hd' + idx), drag = false;
    el.addEventListener('pointerdown', function (e) { drag = true; try { el.setPointerCapture(e.pointerId); } catch (x) { /* nada */ } e.preventDefault(); el.focus({ preventScroll: true }); });
    el.addEventListener('pointermove', function (e) { if (!drag) return; var r = box.getBoundingClientRect(); setBoundary(idx, (e.clientX - r.left) / r.width * 100); });
    var end = function () { drag = false; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', function (e) {
      var cur = idx === 0 ? Reg.pcts[0] : Reg.pcts[0] + Reg.pcts[1], st = e.shiftKey ? 5 : 1;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { setBoundary(idx, cur - st); e.preventDefault(); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { setBoundary(idx, cur + st); e.preventDefault(); }
    });
  });
}

function readPhoto(file, cb, opt) {
  opt = opt || {}; var MAX = opt.max || 480, Q0 = opt.q || 0.78, WANT = opt.want || 170000, CAP = opt.cap || 230000;
  var fr = new FileReader();
  fr.onerror = function () { cb(null); };
  fr.onload = function () {
    var img = new Image();
    img.onerror = function () { cb(null); };
    img.onload = function () {
      var s = Math.min(1, MAX / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * s)); cv.height = Math.max(1, Math.round(img.height * s));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var q = Q0, d = cv.toDataURL('image/jpeg', q);
      while (d.length > WANT && q > 0.35) { q -= 0.1; d = cv.toDataURL('image/jpeg', q); }
      cb(d.length > CAP ? null : d);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

async function saveFile(name, data) {
  // Si Cauce se abre como archivo suelto (sin Claude alrededor), el navegador descarga el archivo directamente.
  if (!hasPlatform()) {
    try {
      var blob = new Blob([data], { type: /\.csv$/.test(name) ? 'text/csv;charset=utf-8' : 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast(T('Archivo listo'));
    } catch (e) { toast(T('No pude guardar el archivo. Intenta de nuevo.')); }
    return;
  }
  try {
    var d = await window.claude.use('downloads');
    if (!d) { toast(T('Aquí no puedo descargar archivos.')); return; }
    await d.save({ filename: name, data: data });
    toast(T('Archivo listo'));
  } catch (e) {
    if (e && e.code === 'declined') return;
    toast(T('No pude guardar el archivo. Intenta de nuevo.'));
  }
}
ACT['exp-csv'] = function () { saveFile('cauce-movimientos.csv', C.toCSV(App.S)); };

function fxRateTxt(fr, rate) { return '1 ' + fr.orient.one + ' = ' + fr.orient.other + ' ' + C.fmtRate(rate, fr.orient.other); }
// Cuánto llevas de lo que vale en total (la casa) y cuánto falta, pasado a tu moneda con el dólar de hoy o, si no hay, con tu tasa promedio.
function fxGoalHTML(v, nv, fr) {
  if (!v.goalNat || nv.native == null) return '';
  var S = App.S, have = nv.native, pct = Math.max(0, Math.min(1, have / v.goalNat)), left = Math.max(0, v.goalNat - have), now = C.fxNowRate(S, nv.cur);
  var perBase = now ? now.per : (fr && fr.avg ? (fr.orient.oneIsBase ? fr.avg : 1 / fr.avg) : null);
  var h = '<div class="fxgoal"><div class="kvl"><span>' + esc(T('Llevas')) + '</span><b class="num">' + esc(C.moneyIn(have, nv.cur) + ' / ' + C.moneyIn(v.goalNat, nv.cur)) + '</b></div>'
    + '<div class="pbar big" aria-hidden="true"><i style="width:' + Math.round(pct * 100) + '%"></i></div>';
  if (left <= 0) h += '<p class="note" style="margin-top:6px">' + esc(T('¡Completaste el valor total!')) + '</p>';
  else h += '<p class="note" style="margin-top:6px">' + esc(TF('Llevas el {0} %. Faltan {1}', Math.round(pct * 100), C.moneyIn(left, nv.cur)) + (perBase ? ' ≈ ' + M(left / perBase) + ' ' + (now ? T('al dólar de hoy') : T('a tu tasa promedio')) : '')) + '.</p>';
  return h + '</div>';
}
function fxNowRow(cur, backId, hint) {
  var n = C.fxNowRate(App.S, cur), o = C.fxOrient(App.S, cur);
  return '<div class="fxnow"><div><div class="t">' + esc(T('Tasa de hoy')) + '</div><div class="s">' + (n ? esc(fxRateTxt({ orient: o }, n.rate) + ' · ' + C.dayLabel(n.d, App.now())) : esc(hint || T('Ponla para ver cuánto valen hoy tus pesos.'))) + '</div></div>'
    + '<button type="button" class="link" data-act="fxnow" data-cur="' + cur + '"' + (backId ? ' data-back="' + esc(backId) + '"' : '') + '>' + esc(n ? T('Cambiar') : T('Poner')) + '</button></div>';
}
// Cada aporte con su tasa, del más reciente al más viejo.
function fxRowsHTML(fr, now) {
  var h = '<div class="lbl" style="margin-top:22px">' + esc(T('Aportes y tasa')) + '</div><div class="list">';
  fr.rows.forEach(function (r) {
    var title = r.open ? T('Saldo inicial') : r.inflow ? TF('Aporte desde {0}', pocketName(r.other)) : TF('Retiro hacia {0}', pocketName(r.other));
    var sub = C.dayLabel(r.d, now) + ' · ' + (r.nat ? M(r.base) + ' → ' + C.moneyIn(r.nat, fr.cur) : M(r.base) + ' · ' + T('sin tasa, toca para ponerla'));
    h += '<button type="button" class="row fxr" data-act="tx" data-id="' + esc(r.id) + '"><div class="grow"><div class="t">' + esc(title) + '</div><div class="s">' + esc(sub) + '</div></div>'
      + '<div class="amt-r num">' + esc(r.rate ? C.fmtRate(r.rate, fr.orient.other) : '—') + '<small class="rt-s">' + esc(TF('{0} por {1}', fr.orient.other, fr.orient.one)) + '</small></div></button>';
  });
  return h + '</div>';
}
var FXN = null;
ACT.fxnow = function (el) {
  var cur = el.dataset.cur, o = C.fxOrient(App.S, cur), n = C.fxNowRate(App.S, cur); FXN = { cur: cur, back: el.dataset.back || null };
  var h = sheetHead(T('Tasa de hoy')) + '<label class="field"><span>' + esc(TF('1 {0} hoy = ¿cuántos {1}?', o.one, o.other)) + '</span><input class="inp" id="fxn-r" type="text" inputmode="decimal" autocomplete="off" value="' + esc(n ? trimRate(n.rate) : '') + '" placeholder="' + (o.rough >= 20 ? '3.900' : '1,08') + '"></label>'
    + '<p class="note">' + esc(T('Es solo para estimar cuánto valdrían hoy tus pesos. No cambia tus saldos ni lo que ya enviaste.')) + '</p>'
    + '<div class="msg" id="fxn-msg" role="alert"></div><div class="actions"><button type="button" class="btn block" data-act="fxnow-save">' + esc(T('Guardar')) + '</button>' + (n ? '<button type="button" class="btn ghost block" data-act="fxnow-clear">' + esc(T('Quitar')) + '</button>' : '') + '</div>';
  openSheet(h, { label: T('Tasa de hoy'), onClose: function () { FXN = null; } });
};
function fxnowDone() {
  var back = FXN && FXN.back; App.commit();
  if (back && findInv(back)) openInv(back); else if (back && findDebt(back)) openDebt(back); else closeSheet();
}
ACT['fxnow-save'] = function () {
  var r = parseRateIn($('#fxn-r').value, C.fxOrient(App.S, FXN.cur).rough);
  if (!(r > 0)) { $('#fxn-msg').textContent = T('Escribe cuánto vale hoy.'); return; }
  C.setFxNow(App.S, FXN.cur, r, App.now()); toast(T('Tasa de hoy guardada')); fxnowDone();
};
ACT['fxnow-clear'] = function () { C.setFxNow(App.S, FXN.cur, 0); toast(T('Tasa de hoy quitada')); fxnowDone(); };
function openInv(id) {
  var S = App.S, v = findInv(id); if (!v) return;
  var now = App.now(), i = C.invInfo(S, v, now);
  var moves = C.sortedTx(S).filter(function (t) { return t.t === 'm' && (t.to === id || t.from === id); }).slice(0, 8);
  var h = sheetHead('') + '<h2 class="c">' + esc(v.name) + '</h2><p class="sub" style="text-align:center;margin-top:4px">' + esc(invTerms(v)) + '</p>';
  if (i.closed) {
    h += '<div class="kpi"><div class="l">' + esc(TF('Cobrada el {0}', dateLong(i.closedAt))) + '</div><div class="v num">' + esc(M(i.received)) + '</div></div>';
    h += '<div class="kvs">' + kvLine(i.gain >= 0 ? T('Ganancia') : T('Pérdida'), signed(i.gain), i.gain > 0 ? 'pos' : '') + '</div>';
    h += '<div class="actions"><button type="button" class="btn ghost block" data-act="inv-reopen" data-id="' + esc(id) + ('">' + T('Reabrir') + '</button><button type="button" class="btn warn block" data-act="inv-del" data-id="') + esc(id) + ('">' + T('Eliminar') + '</button></div>');
  } else {
    h += ('<div class="kpi"><div class="l">' + T('Hoy vale (estimado)') + '</div><div class="v num">') + esc(M(i.value)) + '</div></div><div class="kvs">'
      + kvLine(T('Pusiste'), M(i.principal));
    var nvd = C.invNative(S, v), fr = C.invFxRows(S, v);
    if (nvd) {
      h += kvLine(TF('En {0}', nvd.cur), nvd.native != null ? C.moneyIn(nvd.native, nvd.cur) : '—');
      if (fr && fr.avg) {
        h += kvLine(T('Tasa promedio'), fxRateTxt(fr, fr.avg));
        if (fr.min != null && fr.max != null && fr.min !== fr.max) h += kvLine(T('Tasa más baja'), fxRateTxt(fr, fr.min)) + kvLine(T('Tasa más alta'), fxRateTxt(fr, fr.max));
      }
      var vn = nvd.native != null ? C.valueAtNow(S, nvd.cur, nvd.native) : null;
      if (vn != null) h += kvLine(T('Hoy valdría ≈'), M(vn)) + kvLine(T('Por la tasa de hoy'), signed(C.r2(vn - nvd.base)), vn > nvd.base ? 'pos' : '');
    }
    var grows = v.rate > 0;
    if (grows) h += kvLine(T('Ganado hasta hoy'), signed(i.gain), i.gain > 0 ? 'pos' : '');
    if (v.months) {
      h += kvLine(i.matured ? T('Venció el') : T('Vence el'), dateLong(i.end)) + kvLine(T('Al vencimiento ≈'), M(i.atEnd)) + kvLine(T('Ganancia total ≈'), signed(i.gainAtEnd), 'pos');
      h += '</div><div class="pbar big" aria-hidden="true"><i style="width:' + Math.round(i.pctTime * 100) + '%"></i></div>';
      if (i.matured) h += ('<p class="info">' + T('Ya llegó la fecha. Cuando recibas el dinero, toca «Cobrar y cerrar».') + '</p>');
      else h += '<p class="note" style="margin-top:6px">' + esc(TF('Faltan {0} para el vencimiento.', plural(i.daysLeft, T('día'), T('días')))) + '</p>';
    } else h += (grows ? kvLine(T('En 12 meses ≈'), M(i.in12)) + kvLine(T('Ganancia en 12 meses ≈'), signed(i.gain12), 'pos') : '') + '</div>';
    if (nvd) h += fxGoalHTML(v, nvd, fr) + fxNowRow(nvd.cur, id);
    h += '<div class="actions two"><button type="button" class="btn acc" data-act="inv-add" data-id="' + esc(id) + ('">' + T('Aportar') + '</button><button type="button" class="btn ghost" data-act="inv-out" data-id="') + esc(id) + ('">' + T('Retirar') + '</button></div>');
    h += '<div class="actions"><button type="button" class="btn block" data-act="inv-close" data-id="' + esc(id) + ('">' + T('Cobrar y cerrar') + '</button><button type="button" class="btn ghost block" data-act="inv-edit" data-id="') + esc(id) + ('">' + T('Editar') + '</button></div>');
    if (grows) h += ('<p class="note">' + T('Estimado con interés efectivo anual. Tu entidad puede calcular distinto por impuestos, retenciones o días exactos.') + '</p>');
  }
  var frAll = !i.closed ? C.invFxRows(S, v) : null;
  if (frAll && frAll.rows.length) h += fxRowsHTML(frAll, now);
  else if (moves.length) {
    h += ('<div class="lbl" style="margin-top:22px">' + T('Movimientos') + '</div><div class="list">') + moves.map(function (t) {
      var inn = t.to === id;
      return '<div class="row" style="min-height:48px;padding:10px 0"><div class="grow"><div class="t">' + esc(inn ? (t.open ? T('Saldo inicial') : TF('Aporte desde {0}', pocketName(t.from))) : TF('Retiro hacia {0}', pocketName(t.to))) + '</div><div class="s">' + esc(C.dayLabel(t.d, now) + (t.fx ? ' · ' + C.moneyIn(t.fx.a, t.fx.c) : '')) + '</div></div><div class="amt-r num' + (inn ? ' pos' : '') + '">' + (inn ? '+' : '−') + esc(M(t.amt)) + '</div></div>';
    }).join('') + '</div>';
  }
  openSheet(h, { label: v.name });
}
ACT['inv-add'] = function (el) { openRegister({ mode: 'm', from: bestSource(), to: el.dataset.id }); };
ACT['inv-out'] = function (el) { openRegister({ mode: 'm', from: el.dataset.id, to: 'aho' }); };
ACT['inv-edit'] = function (el) { openInvForm(el.dataset.id); };
ACT['inv-close'] = function (el) { openInvClose(el.dataset.id); };
ACT['inv-reopen'] = function (el) { C.reopenInvestment(App.S, el.dataset.id); closeSheet(); App.commit(); toast(T('Inversión reabierta')); };
ACT['inv-del'] = function (el) {
  if (!armed(el, T('Toca otra vez para eliminar'))) return;
  C.deleteInvestment(App.S, el.dataset.id); closeSheet(); App.commit(); toast(T('Inversión eliminada'));
};

// ---- formulario ----
function ifKeep() {
  if (!IF) return;
  ['name', 'rate', 'months', 'amt', 'date', 'goal'].forEach(function (k) { var e = $('#if-' + k); if (e) IF[k] = e.value; });
}
function invFormHTML() {
  var S = App.S, edit = !!IF.id, td = C.ymd(App.now()), b = C.balances(S), h = sheetHead(edit ? T('Editar inversión') : T('Nueva inversión'));
  h += field('if-name', T('¿En qué invertiste?'), 'text', IF.name, ('maxlength="40" placeholder="' + T('CDT, cuenta de alto rendimiento…') + '"'));
  h += ('<div class="two-f"><label class="field"><span>' + T('Rentabilidad anual (E.A.)') + '</span><div class="inp-suf"><input class="inp" id="if-rate" type="text" inputmode="decimal" placeholder="') + esc(plainNum(12.5)) + '" value="' + esc(IF.rate || '') + '"><em>%</em></div></label>'
    + field('if-months', T('Plazo en meses (opcional)'), 'number', IF.months, 'min="1" max="600" inputmode="numeric" placeholder="12"') + '</div>';
  var base = S.profile.currency, fcur = IF.cur && IF.cur !== base ? IF.cur : null;
  h += ('<label class="field"><span>' + T('Moneda de la inversión') + '</span><select class="inp" data-chg="if-cur" id="if-cur">') + [base].concat(Object.keys(C.CURRENCIES).filter(function (k) { return k !== base; })).map(function (k) { return '<option value="' + k + '"' + ((IF.cur || base) === k ? ' selected' : '') + '>' + esc(k + ' · ' + C.curLabel(k)) + '</option>'; }).join('') + '</select></label>';
  if (!edit) h += field('if-amt', fcur ? TF('¿Cuánto enviaste en {0}?', base) : T('¿Cuánto invertiste?'), 'text', IF.amt, 'inputmode="decimal" placeholder="0"');
  if (!edit && fcur) h += fxFieldsHTML('if', fcur, true, IF.fxs);
  if (fcur) h += field('if-goal', TF('Valor total o meta en {0} (opcional)', fcur), 'text', IF.goal, 'inputmode="decimal" placeholder="' + esc(C.fmtRate(40000000, fcur)) + '"') + '<p class="note" style="margin-top:-6px">' + esc(T('Por ejemplo, lo que cuesta la casa. Así ves cuánto llevas y cuánto falta.')) + '</p>';
  h += '<div class="info" id="if-prev" role="status"></div>';
  if (!edit) {
    h += ('<div class="lbl">' + T('¿De dónde sale?') + '</div><div class="chips">') + chipHTML('if-src', 'open', T('Ya lo tenía'), IF.src === 'open') + spendPlaces().map(function (p) { return chipHTML('if-src', p.id, placeLabel(p), IF.src === p.id, M(b[p.id] || 0)); }).join('') + '</div>';
    h += '<p class="note" style="margin-top:6px">' + (IF.src === 'open' ? T('Solo la registra: no se descuenta de tus cuentas.') : T('Se descuenta de esa cuenta.')) + '</p>';
    h += field('if-date', T('Desde cuándo'), 'date', IF.date || td, 'max="' + td + '"').replace('class="inp"', 'class="inp date"');
  }
  h += '<div class="msg" id="if-msg" role="alert"></div><div class="actions"><button type="button" class="btn block" data-act="if-save">' + (edit ? T('Guardar') : T('Crear inversión')) + '</button>' + (edit ? ('<button type="button" class="btn warn block" data-act="if-del">' + T('Eliminar inversión') + '</button>') : '') + '</div>';
  if (edit) h += ('<p class="note">' + T('Para cambiar el monto, edita los movimientos de esta inversión.') + '</p>');
  return h;
}
function ifPaint() {
  var el = $('#if-prev'); if (!el || !IF) return;
  var S = App.S, rate = parseRate(($('#if-rate') || {}).value), months = parseInt(($('#if-months') || {}).value, 10);
  var amt = IF.id ? (C.balances(S)[IF.id] || 0) : parseAmt(($('#if-amt') || {}).value), t;
  if (!(rate >= 0)) t = T('Escribe la rentabilidad anual para ver cuánto podría crecer.');
  else if (!(amt > 0)) t = T('Escribe cuánto invertiste para ver cuánto podría crecer.');
  else {
    var mo = months >= 1 ? months : 12, end = C.projectGrowth(amt, rate, mo);
    t = TF('En {0}, tus {1} llegarían a ≈ {2}. Ganarías ≈ {3}.', plural(mo, T('mes'), T('meses')), M(amt), M(end), M(end - amt)) + (months >= 1 ? '' : ' ' + T('Sin plazo fijo: calculado a 12 meses.'));
  }
  el.textContent = t;
}
function openInvForm(id) {

function ifAfter() { bindInput(['if-rate', 'if-months', 'if-amt', 'if-goal'], ifPaint); ifPaint(); ifFxBind(); }
ACT['if-src'] = function (el) { ifKeep(); IF.src = el.dataset.id; setSheet(invFormHTML()); ifAfter(); };
CHG['if-cur'] = function (el) {

ACT['if-save'] = function () {

ACT['if-del'] = function (el) {
  if (!armed(el, T('Toca otra vez para eliminar'))) return;

};

// ---- cobrar ----

// ================= Deudas =================
// Montos de una deuda: en su moneda si es de otra moneda, en la tuya si no.
function debtM(n, di) { return di.cur ? C.moneyIn(n, di.cur) : M(n); }
function debtTotal(d, di) { return di.cur ? C.moneyIn(di.totalNat, di.cur) : M(d.total); }
function debtRateTxt(di) { return rateTxt(App.S.profile.currency, di.cur, 1, di.rate); }
function debtEstTxt(di) {
  var r = debtRateTxt(di), m = M(di.remaining);
  return di.how === 'today' ? TF('≈ {0} con la tasa de hoy ({1})', m, r) : di.how === 'last' ? TF('≈ {0} con la tasa de tu último pago ({1})', m, r)
    : di.how === 'start' ? TF('≈ {0} con la tasa de cuando la creaste ({1})', m, r) : TF('≈ {0} con una tasa aproximada ({1})', m, r);
}
function debtRow(d, di) {
  return '<button type="button" class="wrow" data-act="debt" data-id="' + esc(d.id) + '"><div class="wtop"><div class="nm">' + esc(d.name) + '</div><div class="val num">' + esc(di.cur ? debtM(di.remainingNat, di) : M(di.remaining)) + '</div></div>'
    + '<div class="pbar" aria-hidden="true"><i style="width:' + Math.round(di.pct * 100) + '%"></i></div>'
    + '<div class="wsub"><span class="num">' + esc(TF('{0} de {1} pagado', di.cur ? debtM(di.paidNat, di) : M(di.paid), debtTotal(d, di))) + '</span><span class="num">' + Math.round(di.pct * 100) + ' %</span></div>'
    + (di.cur ? '<div class="wsub"><span class="num">' + esc(TF('≈ {0} que faltan', M(di.remaining))) + '</span></div>' : '') + '</button>';
}
function renderDebtsBody() {
  var S = App.S, b = C.balances(S), h = '';
  if (!S.debts.length) {
    return ('<div class="empty"><h2>' + T('Salir de deudas, a tu ritmo') + '</h2><p>' + T('Un préstamo, una tarjeta, lo que le debes a alguien. Créala, ve pagándola desde tus cuentas y, cuando llegue a cero, pasa al historial.') + '</p><button type="button" class="btn" data-act="debt-new">' + T('Crear mi primera deuda') + '</button></div>');
  }

var AU = null;
function authErr(e) {

  if (/email-already-in-use/.test(c)) return T('Ya hay una cuenta con ese correo. Entra en vez de crear una.');
  if (/weak-password|password-does-not-meet/.test(c)) return T('La contraseña es muy corta. Usa al menos 8 caracteres.');
  if (/requires-recent-login/.test(c)) return T('Por seguridad, vuelve a escribir tu contraseña actual.');
  if (/invalid-email|missing-email/.test(c)) return T('Revisa el correo: no parece estar completo.');
  if (/network-request-failed|unavailable/.test(c)) return T('No hay conexión. Inténtalo de nuevo cuando vuelva el internet.');
  if (/too-many-requests/.test(c)) return T('Demasiados intentos. Espera unos minutos e inténtalo otra vez.');
  if (/operation-not-allowed|configuration-not-found/.test(c)) return T('El ingreso con correo todavía no está activado en Firebase.');
  if (/unauthorized-domain/.test(c)) return T('Este sitio todavía no está autorizado en Firebase (Authentication → Settings → Authorized domains).');
  return T('No pude entrar. Inténtalo de nuevo.');
}

}

}

  App.acct = await Store.account();
  var remote = await Store.pull(), st = Store.status();
  if (remote === null && (st === 'error' || st === 'offline')) { Store.disconnect(); toast(T('No pude leer tu copia en la nube. Inténtalo otra vez en un momento.')); if (App.S) render(); return false; }
  var R = remote ? C.migrate(remote) : null;
  if (!R) {                                            // cuenta nueva o vacía: se sube lo de este dispositivo

    paintSync(); toast(App.S ? T('Listo: tus datos ya se guardan en tu cuenta.') : T('Listo: ya estás en tu cuenta.')); return true;
  }

  openConflict(R); return true;
}

  h += ('<div class="actions"><button type="button" class="btn block" data-act="cf-cloud">' + T('Usar lo de mi cuenta') + '</button>')
    + ('<button type="button" class="btn ghost block" data-act="cf-local">' + T('Subir lo de este dispositivo') + '</button></div>')
    + ('<p class="note">' + T('Si cierras esto sin elegir, no cambio nada y sales de tu cuenta.') + '</p>');
  openSheet(h, { label: T('Ya hay datos en tu cuenta'), onClose: function () {
    if (!CF || CF.done) { CF = null; return; }
    CF = null; Store.disconnect();
    try { window.CauceAuth.signOut(); } catch (e) { /* nada */ }
    App.acct = null; paintSync(); if (App.S && App.tab === 'set') render();
    toast(T('No cambié nada. Cuando quieras, entra de nuevo desde Ajustes.'));
  } });
}
ACT['cf-cloud'] = function (el) {
  if (!armed(el, T('Toca otra vez: se reemplaza lo de este dispositivo'))) return;
  var R = CF.R; CF.done = true; closeSheet(); takeRemote(R); toast(T('Listo: ahora ves lo de tu cuenta.'));
};
ACT['cf-local'] = function (el) {
  if (!armed(el, T('Toca otra vez: se reemplaza lo de tu cuenta'))) return;
  CF.done = true; closeSheet(); Store.save(App.S, true); render(); toast(T('Listo: tu cuenta ahora tiene lo de este dispositivo.'));
};


// ---- Seguridad de la cuenta: verificar el correo, cambiar la contraseña, borrar la cuenta
function secHTML() {
  var u = authUser() || {}, ver = !!u.verified;
  var h = sheetHead(T('Seguridad de tu cuenta'));
  h += '<div class="list"><div class="row"><div class="grow"><div class="t">' + esc(u.email || '') + '</div><div class="s">' + (ver ? T('Correo verificado') : T('Correo sin verificar')) + '</div></div></div></div>';
  if (!ver) h += ('<p class="note">' + T('Te mandé un correo con un enlace. Ábrelo y después toca «Ya lo verifiqué». Si no llega, revisa la carpeta de spam o pide otro.') + '</p>')
    + ('<div class="actions"><button type="button" class="btn block" data-act="sec-check">' + T('Ya lo verifiqué') + '</button><button type="button" class="btn ghost block" data-act="sec-resend">' + T('Reenviar el correo') + '</button></div>');
  h += '<div class="msg" id="au-msg" role="alert"></div>';
  h += ('<div class="actions"><button type="button" class="btn ghost block" data-act="pw-open">' + T('Cambiar mi contraseña') + '</button><button type="button" class="btn ghost block" data-act="del-open">' + T('Borrar mi cuenta') + '</button></div>');
  return h;
}
ACT['sec-open'] = function () { if (authUser()) { unToast(); openSheet(secHTML(), { label: T('Seguridad de tu cuenta') }); } };
function secMsg(t, good) { var m = $('#au-msg'); if (m) { m.style.color = good ? 'var(--ink2)' : ''; m.textContent = t; } }
ACT['sec-resend'] = async function (el) {
  if (el.disabled) return; el.disabled = true; secMsg('');
  try { await window.CauceAuth.resendVerification(); secMsg(T('Listo: te mandé otro correo.'), true); }
  catch (e) { secMsg(authErr(e)); }
  el.disabled = false;
};
ACT['sec-check'] = async function (el) {
  if (el.disabled) return; el.disabled = true; secMsg('');
  try {
    var u = await window.CauceAuth.refresh();
    if (u && u.verified) { setSheet(secHTML()); toast(T('Listo: tu correo quedó verificado.')); return; }
    secMsg(T('Todavía no aparece verificado. Abre el enlace del correo y vuelve a tocar aquí.'));
  } catch (e) { secMsg(authErr(e)); }
  el.disabled = false;
};

var PW = null;
function pwHTML() {
  var h = sheetHead(T('Cambiar tu contraseña'));
  h += field('pw-old', T('Contraseña actual'), 'password', '', 'autocomplete="current-password"');
  h += field('pw-new', T('Contraseña nueva (mínimo 8 caracteres)'), 'password', '', 'autocomplete="new-password"');
  h += field('pw-new2', T('Repite la contraseña nueva'), 'password', '', 'autocomplete="new-password"');
  h += '<div class="msg" id="au-msg" role="alert"></div>';
  h += ('<div class="actions"><button type="button" class="btn block" data-act="pw-go">' + T('Cambiar contraseña') + '</button><button type="button" class="btn ghost block" data-act="sec-open">' + T('Volver') + '</button></div>');
  return h;
}
ACT['pw-open'] = function () { PW = { busy: false }; unToast(); openSheet(pwHTML(), { label: T('Cambiar tu contraseña'), onClose: function () { PW = null; } }); };
ACT['pw-go'] = async function (el) {
  if (!PW || PW.busy) return;
  var o = $('#pw-old').value || '', n = $('#pw-new').value || '', n2 = $('#pw-new2').value || '';
  if (!o) { secMsg(T('Escribe tu contraseña actual.')); return; }
  if (n.length < 8) { secMsg(T('La contraseña es muy corta. Usa al menos 8 caracteres.')); return; }
  if (n !== n2) { secMsg(T('Las dos contraseñas nuevas no coinciden.')); return; }
  if (n === o) { secMsg(T('La contraseña nueva debe ser distinta de la actual.')); return; }
  PW.busy = true; el.disabled = true; secMsg('');
  try { await window.CauceAuth.changePassword(o, n); }
  catch (e) { if (PW) { PW.busy = false; el.disabled = false; secMsg(authErr(e)); } return; }
  PW = null; closeSheet(); toast(T('Listo: cambié tu contraseña.'));
};

var DEL = null;
ACT['del-open'] = function () {
  DEL = { busy: false }; unToast();
  var h = sheetHead(T('¿Borrar tu cuenta?'));
  h += ('<p class="sub">' + T('Se borran tu cuenta y la copia de tus datos en la nube, y no se pueden recuperar. Lo que hay en este dispositivo se queda como está, pero sin cuenta. Si quieres, guarda antes una copia desde Ajustes.') + '</p>');
  h += field('del-pw', T('Escribe tu contraseña para confirmar'), 'password', '', 'autocomplete="current-password"');
  h += '<div class="msg" id="au-msg" role="alert"></div>';
  h += ('<div class="actions"><button type="button" class="btn warn block" data-act="del-go">' + T('Borrar mi cuenta y mis datos en la nube') + '</button><button type="button" class="btn ghost block" data-act="close">' + T('Mejor no') + '</button></div>');
  openSheet(h, { label: T('¿Borrar tu cuenta?'), onClose: function () { DEL = null; } });
};
ACT['del-go'] = async function (el) {
  if (!DEL || DEL.busy) return;
  var pw = $('#del-pw').value || '';
  if (!pw) { secMsg(T('Escribe tu contraseña para confirmar.')); return; }
  if (!armed(el, T('Toca otra vez: se borra de verdad'))) return;
  DEL.busy = true; el.disabled = true; secMsg('');
  try { await window.CauceAuth.deleteAccount(pw); }
  catch (e) { if (DEL) { DEL.busy = false; el.disabled = false; delete el.dataset.armed; el.textContent = T('Borrar mi cuenta y mis datos en la nube'); secMsg(/auth\//.test((e && e.code) || '') ? authErr(e) : T('No pude borrar todo. Inténtalo de nuevo en un momento.')); } return; }
  DEL = null; closeSheet(); Store.disconnect(); App.acct = null; paintSync(); if (App.S) render();
  toast(T('Tu cuenta y tus datos en la nube se borraron. Lo de este dispositivo sigue aquí.'));
};

// ---- Salir
ACT['auth-out'] = function () {
  var st = Store.status(), risky = st !== 'synced' && st !== 'local';
  var h = sheetHead(T('¿Salir de tu cuenta?'));
  h += ('<p class="sub">' + T('Se borra lo que hay en este dispositivo. Tus datos siguen guardados en tu cuenta y vuelven cuando entres otra vez.') + '</p>');
  if (risky) h += ('<p class="note" style="color:var(--warn)">' + T('Ojo: todavía hay cambios que no se han subido a la nube. Si sales ahora, se pierden. Espera a que diga «Guardado» o guarda una copia en Ajustes.') + '</p>');
  h += ('<div class="actions"><button type="button" class="btn warn block" data-act="auth-out-ok">' + T('Salir y borrar de este dispositivo') + '</button><button type="button" class="btn ghost block" data-act="close">' + T('Mejor no') + '</button></div>');
  openSheet(h, { label: T('Salir de tu cuenta') });
};
ACT['auth-out-ok'] = async function () {
  closeSheet(); toast(T('Saliendo…'), null, null, 15000);
  try { await Promise.race([Store.flush(App.S), new Promise(function (r) { setTimeout(r, 8000); })]); } catch (e) { /* nada */ }
  Store.disconnect(); Store.clearLocal(); App.S = null; App.acct = null; App.tab = 'home'; App.ym = null; applyTheme();
  try { await window.CauceAuth.signOut(); } catch (e) { /* ya no hay sesión útil */ }
  render(); toast(T('Saliste de tu cuenta.'));
};

/* Cauce · arranque */
function hideSplash() { var s = $('#splash'); if (s) { s.style.transition = 'opacity .3s'; s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 320); } }
function adopt(remote) {
  var R = C.migrate(remote);
  if (!R || sheetOpen()) return false;
  if (!App.S || R.updatedAt > App.S.updatedAt) { App.S = R; Store.saveLocal(R); applyTheme(); render(); return true; }
  return false;
}
async function cloudInit() {
  try { var dl = await Promise.race([window.claude.use('downloads'), new Promise(function (r) { setTimeout(function () { r(null); }, 6000); })]); App.canDownload = !!dl; if (App.canDownload && App.S && App.tab === 'set' && !sheetOpen()) render(); } catch (e) { App.canDownload = false; }
  var ok = await Store.connect();
  if (!ok) return;
  Store.account().then(function (a) {
    App.acct = a;
    if (!a) return;
    var nm = $('#ob-name'); if (nm && !nm.value && a.name) nm.value = a.name.split(' ')[0].slice(0, 30);
    if (App.S && App.tab === 'set' && !sheetOpen()) render();
  });
  // Si pediste borrar todo y la copia no alcanzó a borrarse, se termina ahora, antes de traer nada.
  if (Store.wipePending()) { var w = await Store.wipeCloud(); if (!w || !w.ok) { paintSync(); return; } }
  var remote = await Store.pull();
  var took = remote ? adopt(remote) : false;
  if (!took && App.S) Store.save(App.S, true);
  if (App.S && App.S.tx.length) Store.photoPrune(App.S.tx.filter(function (t) { return t.rcp; }).map(function (t) { return t.id; }));
  paintSync();
}
// Las letras se piden aparte y después de pintar la app: sin conexión (o con una conexión mala) no retrasan nada y se usan las del sistema.
var FONTS_URL = 'https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100&family=Instrument+Sans:wght@400..700&display=swap';
function loadFonts() {
  try {
    if (Store.isOffline() || document.getElementById('fonts-css')) return;
    var l = document.createElement('link'); l.id = 'fonts-css'; l.rel = 'stylesheet'; l.href = FONTS_URL; document.head.appendChild(l);
  } catch (e) { /* nada */ }
}
function hasPlatform() { return typeof window.claude !== 'undefined' && !!window.claude && typeof window.claude.use === 'function'; }
// Al volver la conexión: si nunca se pudo conectar, se conecta; si ya estaba conectada, se sube lo que se hizo sin red.
// Si la copia de la nube es más nueva que lo de aquí, no se pisa mientras hay algo a medio escribir.
var resyncing = false;
async function resync() {
  if (resyncing || !hasPlatform() || !App.S || Store.isOffline()) return;
  resyncing = true;
  try {
    if (!Store.hasCloud()) { await cloudInit(); return; }
    var remote = await Store.pull();
    var R = remote ? C.migrate(remote) : null;
    if (R && R.updatedAt > App.S.updatedAt) { if (sheetOpen()) { setTimeout(resync, 4000); return; } adopt(remote); }
    else Store.save(App.S, true);
    paintSync();
  } finally { resyncing = false; }
}
function boot() {
  layer = $('#layer');
  C.setTr(I18N.T, I18N.TF);
  App.langPref = C.detectLang();
  bindGlobal();
  document.addEventListener('change', function (e) { var t = e.target, n = t && t.getAttribute && t.getAttribute('data-chg'); if (n && CHG[n]) CHG[n](t, e); });
  Store.onStatus(paintSync);
  App.S = C.migrate(Store.loadLocal());
  if (App.S && C.ensureTrial(App.S, App.now())) { App.stamp(); Store.saveLocal(App.S); }
  applyTheme();
  var hasWin = hasPlatform();
  if (!hasWin) App.canDownload = true;
  if (hasAuth()) {
    window.CauceAuth.ready().then(function () { if (App.S && App.tab === 'set' && !sheetOpen()) render(); });
    window.CauceAuth.onChange(function (u) {                      // la sesión se cerró en otra pestaña: se deja de guardar en la nube
      if (!u && Store.hasCloud()) { Store.disconnect(); App.acct = null; paintSync(); if (App.S && App.tab === 'set' && !sheetOpen()) render(); }
    });
  }
  window.addEventListener('online', function () { loadFonts(); resync(); });
  window.addEventListener('offline', function () { Store.goOffline(); paintSync(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { if (App.S) Store.save(App.S, true); return; }
    if (Store.wipePending()) return;
    if (Store.isOffline()) { Store.goOffline(); paintSync(); if (!sheetOpen() && App.S) render(); return; }
    if (hasWin && !Store.hasCloud() && App.S) { resync(); return; }
    if (Store.hasCloud() && Date.now() - Store.lastPull() > 15000) Store.pull().then(function (r) { if (r) adopt(r); });
    else if (!sheetOpen() && App.S) render();
  });
  if (App.S) { render(); hideSplash(); loadFonts(); if (hasWin) cloudInit(); return; }
  if (!hasWin) { render(); hideSplash(); loadFonts(); return; }
  var wait = new Promise(function (r) { setTimeout(r, 2500); });
  Promise.race([cloudInit(), wait]).then(function () { if (!App.S || !sheetOpen()) render(); hideSplash(); loadFonts(); });
}
if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { applyTheme(); }); } catch (e) { /* nada */ } }
boot();

})();
</script>

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
